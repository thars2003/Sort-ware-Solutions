<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sort-Ware Solutions</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" href="{{ url_for('static', filename='logo.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_dark.css') }}">
        
</head>

<body style="background-image:url('{{ url_for('static', filename='background.png') }}'); background-size: cover; background-repeat: no-repeat; background-position: center;">

<div class="main-container">
<div class="outer-wrapper">
<div class="container container-5">

    <!-- HEADER / CONTROLS -->
    <div class="controls-area">
        <div style="display: flex; align-items: center; gap: 20px;">
            <img src="{{ url_for('static', filename='logo.png') }}" class="controls-logo">
            <button type="button" class="play-pause-btn" aria-label="Play or Pause">▶</button>
        </div>
        <h1>Card Sorter</h1>

        <div class="controls-buttons">
            
            <button type="button" class="stop-btn" aria-label="Stop">⏹</button>
        </div>
    </div>

    <!-- TOP ROW -->
    <div class="top-row">

        <!-- MTG PANEL -->
        <div class="container container-1">
            <h2>Magic the Gathering</h2>

            <div class="param-row">
                <div class="game-params"></div>

                <img src="{{ url_for('static', filename='mtg_square.png') }}" class="game-image">

                <div class="sort-params">
                    <h2>Sort By:</h2>

                    <!-- ORIGINAL RADIO STRUCTURE -->
                    <div class="radio-group">
                        <label class="radio-container">
                            <input type="radio" name="sort" value="mtg_price" checked>
                            <span class="custom-radio"></span>
                            Price
                        </label>

                        <label class="radio-container">
                            <input type="radio" name="sort" value="mtg_color">
                            <span class="custom-radio"></span>
                            Color
                        </label>

                        <label class="radio-container">
                            <input type="radio" name="sort" value="mtg_type">
                            <span class="custom-radio"></span>
                            Type
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- SYSTEM STATUS -->
        <div class="container container-2">
            <h2>Status</h2>
            <div class="bin-container" id="binStatus">
                    <div class="status-card">
                    <div class="status-label">WiFi:</div>
                    <div class="status-value" id="wifiStatus">Checking...</div>
                    <a href="/wifi" class="status-btn">Configure</a>
                </div>
 
                <!-- Sort Status -->
                <div class="status-card">
                    <div class="status-label">Sort Status:</div>
                    <div class="status-value" id="sortStatus">Stopped</div>
                </div>
                <div class="status-card">
                    <div class="status-label">Calibrate:</div>
                    <div class="calibrate-btns">
                        <button class="calibrate-btn" onclick="fetch('/calibrate/left', {method:'POST'})">&#8592; Turn CW</button>
                        <button class="calibrate-btn" onclick="fetch('/calibrate/right', {method:'POST'})">Turn CCW &#8594;</button>
                    </div>
                </div>
                <!-- CSV Download -->
                <div class="status-card">
                    <div class="status-label">Export:</div>
                    <a href="/download-csv" class="status-btn">Download CSV</a>
                </div>

                </div>

        </div>

        <!-- POKEMON PANEL -->
        <div class="container container-2">
            <h2>Pokemon</h2>

            <div class="param-row">
                <div class="game-params"></div>

                <img src="{{ url_for('static', filename='poke_square.png') }}" class="game-image">

                <div class="sort-params">
                    <h2>Sort By:</h2>

                    <!-- ORIGINAL RADIO STRUCTURE -->
                    <div class="radio-group">
                        <label class="radio-container">
                            <input type="radio" name="sort" value="pokemon_price">
                            <span class="custom-radio"></span>
                            Price
                        </label>

                        <label class="radio-container">
                            <input type="radio" name="sort" value="pokemon_category">
                            <span class="custom-radio"></span>
                            Category
                        </label>

                        <label class="radio-container">
                            <input type="radio" name="sort" value="pokemon_type">
                            <span class="custom-radio"></span>
                            Type
                        </label>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- SYSTEM LOG -->
    <div class="container container-3">
        <h2>System Log</h2>
    <div id="log" class="log-container"></div>
</div>

</div>
</div>
</div>

<script>
const sortStatusEl = document.getElementById('sortStatus');
const btn = document.querySelector('.play-pause-btn');
const stopBtn = document.querySelector('.stop-btn');
let eventSource = null;

btn.addEventListener('click', () => {
    btn.classList.toggle('playing');
    if (btn.classList.contains('playing')) {
        btn.textContent = '⏸';
        stopBtn.classList.remove('stopped');
        setRadiosDisabled(true);  
        sortStatusEl.textContent = 'Playing';
        sortStatusEl.className = 'status-value status-playing';
        if (eventSource === null) {
            startStream();
        } else {
            resumeStream();
        }
    } else {
        btn.textContent = '▶';
        sortStatusEl.textContent = 'Paused';
        sortStatusEl.className = 'status-value status-paused';
        pauseStream();
    }
});


stopBtn.addEventListener('click', () => {
    stopStream();
    btn.classList.remove('playing');
    btn.textContent = '▶';
    stopBtn.classList.add('stopped');  
    setRadiosDisabled(false);
    sortStatusEl.textContent = 'Stopped';
    sortStatusEl.className = 'status-value status-stopped';
});

function setRadiosDisabled(disabled) {
    document.querySelectorAll('input[name="sort"]').forEach(r => r.disabled = disabled);

    // Disable/enable the action buttons
    const actionButtons = document.querySelectorAll('.status-btn, .calibrate-btn');
    actionButtons.forEach(btn => {
        btn.disabled = disabled;
        btn.style.pointerEvents = disabled ? 'none' : '';
        btn.style.opacity = disabled ? '0.4' : '';
    });
}
function startStream() {
    const log = document.getElementById("log");
    log.innerHTML = "";

    const sort = getSelectedSort();

    fetch('/start', { method: 'POST' }).then(() => {
        eventSource = new EventSource(`/stream?sort=${sort}`);

        eventSource.onmessage = (event) => {
            const card = JSON.parse(event.data);
            appendLog(card);
        };

        eventSource.addEventListener('stop', () => {
            btn.classList.remove('playing');
            btn.textContent = '▶';
            stopBtn.classList.add('stopped');
            setRadiosDisabled(false);
            sortStatusEl.textContent = 'Stopped';
            sortStatusEl.className = 'status-value status-stopped';
            eventSource.close();
            eventSource = null;
        });

        eventSource.addEventListener('pause', () => {
            btn.classList.remove('playing');
            btn.textContent = '▶';
            sortStatusEl.textContent = 'Paused';
            sortStatusEl.className = 'status-value status-paused';
        });

        eventSource.onerror = () => {
            console.warn("Stream ended or error");
        };
    });
}

function appendLog(card) {
    const log = document.getElementById("log");
    const div = document.createElement("div");
    div.className = "log-card";
    div.innerHTML = `
        <div class="log-row">
            <div class="log-left">
                <strong>${card.card_counter}. ${card.name}</strong><br>
                ${card.subtype}: ${card.subtype_value} | Type: ${card.type} | Price: $${card.price}
            </div>
            <div class="log-right">
                ${card.sort_by}: ${card.sort_value} | Assigned Bin: ${card.bin}
            </div>
        </div>
    `;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;

    if (card.bin_mapping) {
        updateBins(card.bin_mapping, card.bin);
    }
}

function pauseStream() {
    fetch('/pause', { method: 'POST' });
}

function resumeStream() {
    fetch('/resume', { method: 'POST' });
}

function stopStream() {
    fetch('/stop', { method: 'POST' });
    if (eventSource) {
        eventSource.close();
        eventSource = null;
    }
}

function getSelectedSort() {
    const selected = document.querySelector('input[name="sort"]:checked');
    return selected ? selected.value : "";
}

function updateBins(binMapping, activeBin) {
    binMapping.forEach((count, index) => {
        const binNum = index + 1;
        const countEl = document.getElementById(`bin${binNum}`);
        const cardEl = document.getElementById(`binCard${binNum}`);
        if (countEl) countEl.textContent = count;
        if (cardEl) {
            cardEl.classList.toggle("active-bin", binNum === activeBin);
        }
    });
}
// Poll WiFi status every 10 seconds
function fetchWifiStatus() {
    fetch('/wifi-status')
        .then(r => r.json())
        .then(data => {
            const el = document.getElementById('wifiStatus');
            if (data.connected) {
                el.textContent = data.ssid;
                el.className = 'status-value status-playing';
            } else {
                el.textContent = 'Not Connected';
                el.className = 'status-value status-stopped';
            }
        })
        .catch(() => {
            document.getElementById('wifiStatus').textContent = 'Unknown';
        });
}
 
fetchWifiStatus();
setInterval(fetchWifiStatus, 10000);
</script>

</body>
</html>
